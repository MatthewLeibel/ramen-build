name: ios

# Build RAMen for iPhone, the kit for app makers (the Swift package), and test it the way an app maker would: a blank
# app adds the package, answers on the iPhone simulator, the app ends as when iOS closes it, and the next launch must
# find the conversation restored from its memory file, reading only the new message.
#
# Same rules as the other workflows: this repository is public so the builds use GitHub's free runners for public
# projects. It holds no source code: the build fetches RAMen's private repository with a read-only deploy key (secret
# CONTEXT_ENGINE_KEY) that is not kept after the checkout. Build logs stay on the runner; only result and error lines
# are printed. The kit is plain llama.cpp plus RAMen's session memory: nothing of RAMen Pro is in it. Manual runs only.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "which commit, branch or tag of RAMen to build"
        default: "main"

env:
  LLAMA_TAG: v0.9.0

jobs:
  kit:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          repository: MatthewLeibel/context-engine
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.CONTEXT_ENGINE_KEY }}
          persist-credentials: false

      - name: Xcode and its Metal compiler
        run: |
          xcodebuild -version
          if ! xcrun -sdk iphoneos metal --version > /dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain > "$RUNNER_TEMP/metal.log" 2>&1 || { tail -5 "$RUNNER_TEMP/metal.log"; exit 1; }
          fi
          xcrun -sdk iphoneos metal --version 2>&1 | head -1
          cmake --version | head -1
          swift --version 2>&1 | head -1

      - name: The kit's prompt and session rules (no model)
        run: |
          bash mobile/ios-kit/Tests/run.sh > "$RUNNER_TEMP/unit.log" 2>&1 || { grep -E "^FAIL|FAILED|error:|session name" "$RUNNER_TEMP/unit.log" | head -20; exit 1; }
          grep -E "^ALL PASSED|session names" "$RUNNER_TEMP/unit.log"

      - name: llama.cpp (plain, no RAMen patch)
        run: git clone -q --depth 1 --branch "$LLAMA_TAG" https://github.com/ggml-org/llama.cpp "$RUNNER_TEMP/llama.cpp"

      - name: Build the kit
        run: |
          if ! bash mobile/ios-kit/scripts/build_kit.sh "$RUNNER_TEMP/llama.cpp" "$RUNNER_TEMP/kit" 3 > "$RUNNER_TEMP/kit.log" 2>&1; then
            grep -E "^/[^ ]+:[0-9]+:[0-9]+: error: |^error: |CMake Error|BUILD FAILED|xcodebuild: error|slices missing|not a plain build|imports llama|no version" "$RUNNER_TEMP/kit.log" | head -60
            echo "KIT BUILD FAILED"; exit 1
          fi
          grep -E "^== |^Built " "$RUNNER_TEMP/kit.log"

      - name: What is inside
        run: |
          K="$RUNNER_TEMP/kit"
          for f in "$K"/RAMen.xcframework/*/RAMen.framework/RAMen "$K"/llama/llama.xcframework/*/llama.framework/llama; do
            minos=$(otool -l "$f" | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')
            echo "$(basename "$(dirname "$(dirname "$f")")")/$(basename "$f"): $(lipo -archs "$f"), iOS $minos and newer, $(stat -f %z "$f") bytes"
          done
          ls "$K"/llama/llama.xcframework/*/llama.framework/ | sort -u | tr '\n' ' '; echo
          ls -la "$K"/*.zip
          cat "$K/SHA256SUMS"

      - name: Test model (Qwen3 0.6B)
        run: |
          curl -sfL -o "$RUNNER_TEMP/model.gguf" https://huggingface.co/unsloth/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q4_K_M.gguf
          ls -la "$RUNNER_TEMP/model.gguf"

      - name: XcodeGen (makes the blank app's Xcode project)
        run: |
          brew install xcodegen > "$RUNNER_TEMP/brew.log" 2>&1 || { tail -5 "$RUNNER_TEMP/brew.log"; exit 1; }
          xcodegen --version

      - name: A blank app with the package, on the iPhone simulator
        run: bash mobile/ios-kit/samples/Hello/ci_simulator_test.sh local "$RUNNER_TEMP/kit/local" "$RUNNER_TEMP/model.gguf"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ramen-ios-kit
          path: |
            ${{ runner.temp }}/kit/RAMen.xcframework.zip
            ${{ runner.temp }}/kit/llama.xcframework.zip
            ${{ runner.temp }}/kit/package/Package.swift
            ${{ runner.temp }}/kit/SHA256SUMS
          if-no-files-found: ignore
          retention-days: 14
