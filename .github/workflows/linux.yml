name: linux

# Linux packages (x64: CPU, NVIDIA, Vulkan; ARM: CPU) for a release whose engine has not changed on Linux: the ramen
# app built from RAMen's private repository replaces the one inside a released version's packages, which keep their
# compiled llama-server. Then the CPU package is installed and tested on a clean Linux the way a customer would: the
# installer, ramen start, a chat, ramen stop, a restart that must restore the chat, and the RAMen Memory connector.
# A full rebuild (CUDA included) is release/modal_linux.py in RAMen's repository.
#
# Same rules as windows.yml and mac.yml: this repository is public so the builds use GitHub's free runners for public
# projects. It holds no source code: the build fetches RAMen's private repository with a read-only deploy key (secret
# CONTEXT_ENGINE_KEY) that is not kept after the checkout. Only the owner can start a build (manual runs only).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "which commit, branch or tag of RAMen to build"
        default: "main"
      base:
        description: "the released version whose compiled llama-server the packages keep"
        default: "v1.3.0"

jobs:
  repack:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            packages: "cpu cuda vulkan"
          - arch: arm64
            runner: ubuntu-24.04-arm
            packages: "cpu"
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04          # glibc 2.35, the oldest Linux the packages promise
    timeout-minutes: 60
    env:
      BASE: ${{ inputs.base }}
      REL: https://github.com/MatthewLeibel/ramen-releases/releases/download
    steps:
      - name: Tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git openssh-client python3 python3-pip python3-dev \
              binutils curl ca-certificates procps lsof > /dev/null

      - uses: actions/checkout@v4
        with:
          repository: MatthewLeibel/context-engine
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.CONTEXT_ENGINE_KEY }}
          persist-credentials: false

      - name: The ramen app
        run: |
          python3 -m pip install -q pyinstaller==6.11.1
          python3 -m PyInstaller --onefile --name ramen --paths ce-server --collect-submodules ce_server \
              --distpath app --workpath pyi --specpath pyi --log-level WARN ce-server/ramen_entry.py
          ./app/ramen version

      - name: Into the released packages
        run: |
          mkdir -p dist
          for v in ${{ matrix.packages }}; do
            f=ramen-linux-${{ matrix.arch }}-$v.tar.gz
            for x in "$f" "$f.sha256"; do
              curl -fsSL --retry 6 --retry-all-errors --retry-delay 20 -o "$x" "$REL/$BASE/$x"
            done
            [ "$(cut -c1-64 "$f.sha256")" = "$(sha256sum "$f" | cut -c1-64)" ] || { echo "$BASE $f does not match its checksum"; exit 1; }
            rm -rf "p-$v"; mkdir "p-$v"; tar -xzf "$f" -C "p-$v"
            cp app/ramen "p-$v/ramen/bin/ramen"; cp legal/EULA.md "p-$v/ramen/EULA.md"
            tar -C "p-$v" -czf "dist/$f" ramen
            (cd dist && sha256sum "$f" | awk '{print $1}' > "$f.sha256")
            echo "$v: $(p-$v/ramen/bin/ramen version), llama-server from $BASE"
            rm -rf "$f" "$f.sha256" "p-$v"
          done
          ls -la dist

      - name: Only the libraries every Linux has
        run: |
          SYSTEM=" libc.so.6 libm.so.6 libdl.so.2 libpthread.so.0 librt.so.1 ld-linux-x86-64.so.2 ld-linux-aarch64.so.1 libstdc++.so.6 libgcc_s.so.1 libz.so.1 "
          for lib in $(readelf -d app/ramen | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p'); do
            case "$SYSTEM" in *" $lib "*) ;; *) echo "the ramen app needs $lib, which not every Linux has"; exit 1;; esac
          done
          echo "glibc needed by ramen: $(objdump -T app/ramen | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1)"

      - name: Install and test like a customer
        shell: bash
        run: |
          set -uo pipefail
          fail() { echo "FAILED: $1"; ps -eo pid,etime,args | grep -E 'ramen|llama' | grep -v grep; for f in ~/.context-engine/*.log; do echo "--- $f"; tail -40 "$f"; done; exit 1; }
          export RAMEN_PKG="$PWD/dist/ramen-linux-${{ matrix.arch }}-cpu.tar.gz"
          bash install.sh || fail "install"
          export PATH="$HOME/.ramen/bin:$PATH"
          ramen version
          # HTTPS from the app (downloads, licenses): a fake key must reach the license server and be refused
          lic=$(ramen activate RAMEN-PRO-00000000-TEST --data-dir "$RUNNER_TEMP/lic" 2>&1 || true)
          echo "license server: $lic"
          case "$lic" in *"not found"*) ;; *) fail "HTTPS from the app ($lic)";; esac
          curl -sfL --retry 6 --retry-all-errors --retry-delay 20 -o "$RUNNER_TEMP/q.gguf" \
              https://huggingface.co/unsloth/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q4_K_M.gguf || fail "model download"
          ramen start "$RUNNER_TEMP/q.gguf" --ctx 8192 --slots 1 || fail "first start"
          ramen status
          body='{"messages":[{"role":"system","content":"You are a helpful assistant. You answer briefly."},{"role":"user","content":"Name three kinds of noodles."}],"max_tokens":24,"temperature":0}'
          curl -sf -D h1.txt -o r1.json -H 'Content-Type: application/json' -d "$body" http://127.0.0.1:8090/v1/chat/completions || fail "first chat"
          echo "first chat: $(grep -i x-ce-cache h1.txt | tr -d '\r') $(head -c 700 r1.json)"
          t=$(date +%s); out=$(ramen stop); echo "$out (after $(( $(date +%s) - t )) s)"
          case "$out" in *"still saving"*) fail "ramen stop waited 3 minutes";; esac
          ramen start "$RUNNER_TEMP/q.gguf" --ctx 8192 --slots 1 || fail "second start"
          curl -sf -D h2.txt -o r2.json -H 'Content-Type: application/json' -d "$body" http://127.0.0.1:8090/v1/chat/completions || fail "second chat"
          how=$(grep -i x-ce-cache h2.txt | awk '{print $2}' | tr -d '\r')
          echo "second chat after restart: $how"
          out=$(ramen stop); echo "$out"
          case "$out" in *"still saving"*) fail "the second ramen stop waited 3 minutes";; esac
          tail -25 ~/.context-engine/llama-server.log
          [ "$how" = "restored" ] || fail "the chat was not restored after a restart ($how)"
          if grep -q 'needs a licensed RAMen' ~/.context-engine/*.log; then fail 'the engine did not accept the unlock'; fi
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
              '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' > mcp_in.txt
          ramen mcp < mcp_in.txt > mcp_out.txt || fail "ramen mcp"
          python3 -c 'import json; r=[json.loads(l) for l in open("mcp_out.txt")]; n=[t["name"] for t in r[1]["result"]["tools"]]; print("connector:", r[0]["result"]["serverInfo"], n); assert {"recall","remember","memory_status"} <= set(n)' || fail "connector answers"
          # Sleep, the default (study and remember): a conversation with a fact, a night, then the question with the lookup
          ramen start "$RUNNER_TEMP/q.gguf" --ctx 8192 --slots 1 >/dev/null || fail "start for Sleep"
          fact='{"messages":[{"role":"user","content":"My cat is called Zorblax and she is 4 years old. What do cats like to play with?"}],"max_tokens":40,"temperature":0}'
          curl -sf -o /dev/null -H 'Content-Type: application/json' -d "$fact" http://127.0.0.1:8090/v1/chat/completions || fail "Sleep: the conversation"
          ramen stop >/dev/null
          t=$(date +%s); ramen sleep || { tail -40 ~/.context-engine/sleep/llama-server.log; fail "ramen sleep"; }
          echo "Sleep took $(( $(date +%s) - t )) s"; ramen sleep --status
          ramen start "$RUNNER_TEMP/q.gguf" --ctx 8192 --slots 1 >/dev/null || fail "start after Sleep"
          q='{"messages":[{"role":"user","content":"What is my cat called?"}],"max_tokens":30,"temperature":0}'
          curl -sf -D h3.txt -o r3.json -H 'Content-Type: application/json' -d "$q" http://127.0.0.1:8090/v1/chat/completions || fail "Sleep: the question"
          ramen stop >/dev/null
          echo "after Sleep: $(grep -i x-ce-recall h3.txt | tr -d '\r') $(head -c 300 r3.json)"
          grep -qi '^x-ce-recall' h3.txt || fail "Sleep: no notes went with the question"
          grep -qi zorblax r3.json || fail "Sleep: the answer does not have the cat's name"
          echo "SLEEP TEST PASSED"
          echo "LINUX TEST PASSED"

      - uses: actions/upload-artifact@v4
        with:
          name: ramen-linux-${{ matrix.arch }}
          path: dist/*
          retention-days: 14
